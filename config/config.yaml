faiss_db:
  collection_name: "document_portal"

embedding_model:
  model_name: "text-embedding-3-small"
  provider: "openai"

retriever:
  top_k: 5
  search_type: "similarity"

llm:
  openai:
    model_name: "gpt-4o-mini"
    provider: "openai"
    temperature: 0
    max_output_tokens: 1000

  groq:
    provider: "groq"
    model_name: "deepseek-r1-distill-llama-70b"
    temperature: 0
    max_output_tokens: 2048

active:
  llm: "openai"

chunking:
  chunk_size: 500
  chunk_overlap: 50